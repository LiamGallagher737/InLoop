[package]
name = "inloop-mcp"
description = "InLoop's MCP server: the core toolset and the optional PM toolset"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
inloop-core = { path = "../core" }
inloop-decisions = { path = "../decisions" }
inloop-index = { path = "../index" }
inloop-app = { path = "../app" }
inloop-pm = { path = "../pm" }
rmcp = { version = "3.10", features = ["server", "transport-io", "macros", "schemars"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync"] }

[dev-dependencies]
tempfile.workspace = true
insta.workspace = true
rmcp = { version = "3.10", features = ["client", "transport-io", "transport-async-rw"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util"] }
