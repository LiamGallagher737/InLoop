[workspace]
resolver = "3"
members = [
  "crates/core",
  "crates/redact",
  "crates/git",
  "crates/decisions",
  "crates/index",
  "crates/sessions",
  "crates/store",
  "crates/app",
  "crates/mcp",
  "crates/cli",
]
# Crates under construction that are not yet part of the build.
exclude = [
  "crates/pm",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LicenseRef-Proprietary"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive", "env"] }
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
thiserror = "2"
toml = "1"
tempfile = "3"
jiff = { version = "0.2", features = ["serde"] }
globset = "0.4"
rusqlite = { version = "0.42", features = ["bundled"] }
insta = { version = "1", features = ["json", "yaml"] }
